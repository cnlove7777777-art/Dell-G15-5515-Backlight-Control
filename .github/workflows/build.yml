name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build application
        shell: powershell
        run: .\scripts\Build.ps1
      - name: Package application
        shell: powershell
        run: .\scripts\Package.ps1 -Version ci
      - uses: actions/upload-artifact@v7
        with:
          name: G15Backlight-ci
          path: release/G15Backlight-ci.zip
          if-no-files-found: error
